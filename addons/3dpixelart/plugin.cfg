[plugin]

name="3D Pixel Art"
description="Renders 3D objects in a pixelated 2D-sprite art style: per-object pixel size, no pixel creep, per-object outlines, realtime lights/shadows and palette-LUT color grading. Port of the Unity asset ProPixelizer by Elliot Bentine. Requires the Forward+ renderer."
author="Ported to Godot 4 from ProPixelizer (Elliot Bentine)"
version="1.0.0"
script="plugin.gd"
